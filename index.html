<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Screen 1: Language Selection */
        #language-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }

            #language-screen h1 {
                font-size: 1.8rem;
                margin-bottom: 25px;
                color: #38bdf8;
            }

        .lang-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80%;
            max-width: 300px;
        }

        .lang-btn {
            background-color: #334155;
            color: #fff;
            border: 2px solid #475569;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

            .lang-btn:hover {
                background-color: #38bdf8;
                border-color: #38bdf8;
                color: #0f172a;
                font-weight: bold;
            }

        /* Screen 2: Chat Interface */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            background-color: #0f172a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .back-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

            .back-btn:hover {
                background-color: #dc2626;
            }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

            .message.user {
                background-color: #0284c7;
                align-self: flex-end;
                border-bottom-right-radius: 2px;
            }

            .message.ai {
                background-color: #334155;
                align-self: flex-start;
                border-bottom-left-radius: 2px;
            }

        .input-area {
            display: flex;
            padding: 15px;
            background-color: #0f172a;
            gap: 10px;
        }

            .input-area input {
                flex: 1;
                padding: 12px 15px;
                border-radius: 8px;
                border: 1px solid #334155;
                background-color: #1e293b;
                color: #fff;
                outline: none;
            }

                .input-area input:focus {
                    border-color: #38bdf8;
                }

        .send-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

            .send-btn:hover {
                background-color: #7dd3fc;
            }
    </style>
</head>
<body>

    <div class="container">
        <!-- Pantalla de Selección de Idioma -->
        <div id="language-screen">
            <h1>Select Language / Selecciona Idioma</h1>
            <div class="lang-buttons">
                <button class="lang-btn" onclick="selectLanguage('es')">Español 🇪🇸</button>
                <button class="lang-btn" onclick="selectLanguage('en')">English 🇬🇧</button>
                <button class="lang-btn" onclick="selectLanguage('fr')">Français 🇫🇷</button>
                <button class="lang-btn" onclick="selectLanguage('pt')">Português 🇵🇹</button>
                <button class="lang-btn" onclick="selectLanguage('ru')">Русский 🇷🇺</button>
            </div>
        </div>

        <!-- Pantalla del Chat -->
        <div id="chat-screen">
            <div class="chat-header">
                <span id="chat-title">AI Assistant</span>
                <button class="back-btn" id="back-btn-text" onclick="resetApp()">Reiniciar</button>
            </div>
            <div class="chat-box" id="chat-box"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="..." onkeydown="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" id="send-btn-text" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'es';

        // Textos del sistema según el idioma
        const translations = {
            es: {
                title: "Bean AI",
                placeholder: "Escribe tu mensaje aquí...",
                send: "Enviar",
                back: "Volver al inicio",
                welcome: "¡Hola! ¿En qué puedo ayudarte hoy?",
                fallback: "He recibido tu mensaje. ¿Hay algo más en lo que pueda ayudarte?"
            },
            en: {
                title: "Bean AI",
                placeholder: "Type your message here...",
                send: "Send",
                back: "Back to Home",
                welcome: "Hello! How can I help you today?",
                fallback: "I have received your message. Is there anything else I can help you with?"
            },
            fr: {
                title: "Bean AI",
                placeholder: "Écrivez votre message ici...",
                send: "Envoyer",
                back: "Retour au début",
                welcome: "Bonjour ! Comment puis-je vous aider aujourd'hui ?",
                fallback: "J'ai bien reçu votre message. Puis-je vous aider pour autre chose ?"
            },
            pt: {
                title: "Bean AI",
                placeholder: "Digite sua mensagem aqui...",
                send: "Enviar",
                back: "Voltar ao início",
                welcome: "Olá! Como posso ajudar você hoje?",
                fallback: "Recebi sua mensagem. Há mais alguma coisa em que eu possa ajudar?"
            },
            ru: {
                title: "Bean AI",
                placeholder: "Введите ваше сообщение...",
                send: "Отправить",
                back: "Вернуться назад",
                welcome: "Здравствуйте! Чем я могу вам помочь сегодня?",
                fallback: "Я получил ваше сообщение. Чем еще я могу вам помочь?"
            }
        };

        function selectLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            // Aplicar traducciones a la interfaz
            document.getElementById('chat-title').textContent = t.title;
            document.getElementById('user-input').placeholder = t.placeholder;
            document.getElementById('send-btn-text').textContent = t.send;
            document.getElementById('back-btn-text').textContent = t.back;

            // Cambiar pantallas
            document.getElementById('language-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';

            // Mensaje inicial de la IA
            appendMessage(t.welcome, 'ai');
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            // Mostrar mensaje del usuario
            appendMessage(text, 'user');
            input.value = '';

            // Respuesta automática simulada de la IA
            setTimeout(() => {
                appendMessage(translations[currentLang].fallback, 'ai');
            }, 600);
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function resetApp() {
            // Reiniciar estado
            document.getElementById('chat-box').innerHTML = '';
            document.getElementById('user-input').value = '';
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('language-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
